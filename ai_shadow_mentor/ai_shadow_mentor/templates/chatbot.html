{% extends "base.html" %}{% block title %}AI Mentor Chatbot{% endblock %}{% block content %}
<h1 class="text-4xl font-bold title-glow text-center">AI Mentor Chatbot</h1>
<p class="text-center text-slate-300 mb-6">Ask questions and get guidance from your AI mentor 🤖💡</p>
<div class="glass max-w-2xl mx-auto flex flex-col" style="height:60vh">
 <div id="log" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
 <form id="f" class="p-3 flex gap-2 border-t border-slate-800"><input id="m" class="inp" placeholder="Type your message..." autocomplete="off"><button class="btn">Send</button></form>
</div>{% endblock %}
{% block scripts %}<script>
function add(t,who){const d=document.createElement('div');d.className='flex '+(who=='u'?'justify-end':'');
d.innerHTML=`<div class="max-w-[80%] px-4 py-2 text-sm ${who=='u'?'bubble-user':'bubble-bot'}"></div>`;d.firstChild.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
add("Hi! I'm your AI mentor. Ask me anything about tech careers, learning paths, or skills.",'b');
f.onsubmit=async e=>{e.preventDefault();const t=m.value.trim();if(!t)return;add(t,'u');m.value='';
const r=await post('/api/chat',{message:t});add(r.reply||'Something went wrong.','b')};
</script>{% endblock %}
